{% extends "base.html" %} {% block content %}

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h3>Edit Profile</h3>
        </div>

        <div class="card-body">
          <form method="POST">
            {% csrf_token %}

            <div class="row">
              <div class="col-md-6 mb-3">
                <label>First Name</label>

                <input
                  type="text"
                  name="first_name"
                  class="form-control"
                  value="{{ request.user.first_name }}"
                />
              </div>

              <div class="col-md-6 mb-3">
                <label>Last Name</label>

                <input
                  type="text"
                  name="last_name"
                  class="form-control"
                  value="{{ request.user.last_name }}"
                />
              </div>
            </div>

            <div class="mb-3">
              <label>Email Address</label>

              <input
                type="email"
                name="email"
                class="form-control"
                value="{{ request.user.email }}"
              />
            </div>

            <div class="mb-3">
              <label>Phone Number</label>

              <input
                type="text"
                name="phone"
                class="form-control"
                value="{{ customer.phone }}"
              />
            </div>

            <div class="mb-3">
              <label>Address</label>

              <textarea name="address" class="form-control" rows="3">
{{ customer.address }}</textarea
              >
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label>State</label>

                <input
                  type="text"
                  name="state"
                  class="form-control"
                  value="{{ customer.state }}"
                />
              </div>

              <div class="col-md-6 mb-3">
                <label>City</label>

                <input
                  type="text"
                  name="city"
                  class="form-control"
                  value="{{ customer.city }}"
                />
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100">
              Save Changes
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
