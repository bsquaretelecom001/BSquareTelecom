{% extends "base.html" %}

{% block content %}

<div class="container mt-5" style="max-width:500px;">

    <h2>Forgot Password</h2>

    <p>Enter the email address you used to register.</p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-primary w-100">
            Send Reset Link
        </button>

    </form>

</div>

{% endblock %}
