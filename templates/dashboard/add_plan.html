{% extends "dashboard/admin_base.html" %} {% block content %}

<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow border-0">
        <div class="card-header bg-primary text-white">
          <h3 class="mb-0">Add New Internet Plan</h3>
        </div>

        <div class="card-body">
          {% if messages %} {% for message in messages %}

          <div class="alert alert-success">{{ message }}</div>

          {% endfor %} {% endif %}

          <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label"> Plan Name </label>

              <input
                type="text"
                name="name"
                class="form-control"
                placeholder="e.g. 30GB Monthly"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label"> Plan Type </label>

              <select name="plan_type" class="form-select" required>
                <option value="">Select Type</option>

                <option value="Daily">Daily</option>

                <option value="Weekly">Weekly</option>

                <option value="Monthly">Monthly</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label"> Data Allocation </label>

              <input
                type="text"
                name="data"
                class="form-control"
                placeholder="e.g. 30GB"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label"> Validity </label>

              <input
                type="text"
                name="validity"
                class="form-control"
                placeholder="e.g. 30 Days"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label"> Price (₦) </label>

              <input
                type="number"
                name="price"
                step="0.01"
                class="form-control"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label"> Description </label>

              <textarea
                name="description"
                rows="4"
                class="form-control"
                placeholder="Describe this plan..."
              ></textarea>
            </div>

            <div class="d-flex justify-content-between">
              <a href="{% url 'plan_management' %}" class="btn btn-secondary">
                Back
              </a>

              <button type="submit" class="btn btn-success">Save Plan</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
