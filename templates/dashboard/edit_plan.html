{% extends "dashboard/admin_base.html" %} {% block content %}

<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow border-0">
        <div class="card-header bg-warning">
          <h3 class="mb-0">Edit Internet Plan</h3>
        </div>

        <div class="card-body">
          {% if messages %} {% for message in messages %}

          <div class="alert alert-success">{{ message }}</div>

          {% endfor %} {% endif %}

          <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label"> Plan Name </label>

              <input
                type="text"
                name="name"
                class="form-control"
                value="{{ plan.name }}"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label"> Plan Type </label>

              <select name="plan_type" class="form-select">
                <option
                  value="Daily"
                  {%
                  if
                  plan.plan_type=""
                  ="Daily"
                  %}selected{%
                  endif
                  %}
                >
                  Daily
                </option>

                <option
                  value="Weekly"
                  {%
                  if
                  plan.plan_type=""
                  ="Weekly"
                  %}selected{%
                  endif
                  %}
                >
                  Weekly
                </option>

                <option
                  value="Monthly"
                  {%
                  if
                  plan.plan_type=""
                  ="Monthly"
                  %}selected{%
                  endif
                  %}
                >
                  Monthly
                </option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label"> Data </label>

              <input
                type="text"
                name="data"
                class="form-control"
                value="{{ plan.data }}"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label"> Validity </label>

              <input
                type="text"
                name="validity"
                class="form-control"
                value="{{ plan.validity }}"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label"> Price </label>

              <input
                type="number"
                step="0.01"
                name="price"
                class="form-control"
                value="{{ plan.price }}"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label"> Description </label>

              <textarea name="description" rows="4" class="form-control">
{{ plan.description }}</textarea
              >
            </div>

            <div class="d-flex justify-content-between">
              <a href="{% url 'plan_management' %}" class="btn btn-secondary">
                Back
              </a>

              <button type="submit" class="btn btn-success">Update Plan</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
